<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EatBusan Review Image Tester</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2328;
      --muted: #667085;
      --line: #d8dee8;
      --paper: #fffdf8;
      --panel: #ffffff;
      --accent: #0f7b6c;
      --accent-dark: #09584e;
      --warn: #b54708;
      --shadow: 0 18px 50px rgba(25, 35, 48, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(15, 123, 108, 0.07) 1px, transparent 1px),
        linear-gradient(rgba(15, 123, 108, 0.06) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 0 28px;
      border-bottom: 2px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 72px);
      line-height: 0.92;
      max-width: 720px;
      letter-spacing: 0;
    }

    .status {
      min-width: 190px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      text-align: right;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
      padding-top: 28px;
    }

    form,
    .review {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    form {
      padding: 22px;
      position: sticky;
      top: 24px;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font: 700 13px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fbfcfd;
      color: var(--ink);
      padding: 11px 12px;
      margin-bottom: 14px;
      font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid rgba(15, 123, 108, 0.24);
      border-color: var(--accent);
    }

    input[type="file"] {
      padding: 10px;
      background: #fff;
    }

    button {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: white;
      padding: 13px 16px;
      font: 800 15px/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .review {
      min-height: 520px;
      padding: 0;
      overflow: hidden;
    }

    .review-head {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 16px;
      padding: 22px;
      border-bottom: 1px solid var(--line);
      background: #f6faf8;
    }

    .avatar {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      background: #fff;
      font-size: 30px;
      font-weight: 800;
    }

    .review h2 {
      margin: 4px 0 8px;
      font-size: clamp(26px, 4vw, 46px);
      line-height: 1;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .content {
      padding: 22px;
      font: 18px/1.7 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: pre-wrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      padding: 0 22px 22px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid var(--line);
      background: #eef2f6;
    }

    .empty {
      padding: 64px 28px;
      color: var(--muted);
      text-align: center;
      font-size: 18px;
      line-height: 1.5;
    }

    .log {
      margin-top: 16px;
      padding: 14px;
      min-height: 88px;
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #111827;
      color: #d1fae5;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    .error {
      color: #fecaca;
    }

    @media (max-width: 820px) {
      header,
      .layout {
        display: block;
      }

      .status {
        margin-top: 18px;
        text-align: left;
      }

      form {
        position: static;
        margin-bottom: 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>EatBusan Review Image Tester</h1>
      <div class="status" id="status">API http://localhost:8081</div>
    </header>

    <section class="layout">
      <form id="reviewForm">
        <label for="email">email</label>
        <input id="email" name="email" value="visual-test@example.com" autocomplete="off">

        <label for="placeId">placeId</label>
        <input id="placeId" name="placeId" type="number" value="1" min="1">

        <label for="title">title</label>
        <input id="title" name="title" value="배민 리뷰처럼 이미지 붙이기">

        <label for="content">content</label>
        <textarea id="content" name="content">글을 작성하면서 이미지를 같이 첨부하는 통합 업로드 테스트입니다.</textarea>

        <label for="files">images</label>
        <input id="files" name="files" type="file" accept="image/*" multiple>

        <button id="submitButton" type="submit">작성하고 이미지 업로드</button>
        <p class="hint">서버가 꺼져 있으면 먼저 `./gradlew bootRun`을 실행하세요. 회원이 없으면 이 화면이 먼저 자동 가입을 시도합니다.</p>
        <div class="log" id="log">ready</div>
      </form>

      <article class="review" id="review">
        <div class="empty">작성 결과가 여기에 리뷰 카드처럼 표시됩니다.</div>
      </article>
    </section>
  </main>

  <script>
    const API_BASE = "http://localhost:8081";
    const form = document.querySelector("#reviewForm");
    const log = document.querySelector("#log");
    const review = document.querySelector("#review");
    const status = document.querySelector("#status");
    const button = document.querySelector("#submitButton");

    function writeLog(message, isError = false) {
      log.className = isError ? "log error" : "log";
      log.textContent = message;
    }

    async function ensureMember(email) {
      const response = await fetch(`${API_BASE}/api/members/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: "1234" })
      });

      if (response.status === 201 || response.status === 409) {
        return;
      }

      const body = await response.text();
      throw new Error(`회원 준비 실패: ${response.status} ${body}`);
    }

    function renderReview(post) {
      const images = post.images || [];
      review.innerHTML = `
        <div class="review-head">
          <div class="avatar">${post.email.slice(0, 1).toUpperCase()}</div>
          <div>
            <h2>${escapeHtml(post.title)}</h2>
            <p class="meta">postId=${post.postId} · placeId=${post.placeId} · images=${images.length}</p>
          </div>
        </div>
        <div class="content">${escapeHtml(post.content)}</div>
        <div class="gallery">
          ${images.map(image => `<img src="${image.imageUrl}" alt="post image ${image.sortOrder + 1}">`).join("")}
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = "uploading";
      writeLog("회원 확인 중...");

      try {
        const email = form.email.value.trim();
        await ensureMember(email);

        const payload = {
          email,
          placeId: Number(form.placeId.value),
          title: form.title.value.trim(),
          content: form.content.value.trim()
        };

        const body = new FormData();
        body.append("post", new Blob([JSON.stringify(payload)], { type: "application/json" }));

        for (const file of form.files.files) {
          body.append("files", file);
        }

        writeLog("게시글과 이미지를 업로드 중...");
        const response = await fetch(`${API_BASE}/api/posts`, {
          method: "POST",
          body
        });

        const text = await response.text();
        if (!response.ok) {
          throw new Error(`${response.status} ${text}`);
        }

        const post = JSON.parse(text);
        renderReview(post);
        status.textContent = "success";
        writeLog(JSON.stringify(post, null, 2));
      } catch (error) {
        status.textContent = "failed";
        writeLog(error.stack || error.message, true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
