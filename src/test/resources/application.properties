
spring.application.name=eatBusan

spring.config.import=optional:file:.env[.properties]
server.port=8081

# H2 DataSource
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.ssafy.eatBusan
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

#open api
data.kakao.api.baseurl=https://dapi.kakao.com
data.kakao.api.service.key=${KAKAO_API_KEY}

# jWt
jwt.secret.key=${JWT_SECRET_KEY}
jwt.access.time=1800000
jwt.refresh.time=604800000

spring.front.domain=http://localhost:5173

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:test-bucket}
aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.aws.key.id=${AWS_ACCESS_KEY_ID:test}
aws.s3.aws.key.secretKey=${AWS_SECRET_ACCESS_KEY:test}