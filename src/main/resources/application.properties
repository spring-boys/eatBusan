spring.application.name=eatBusan
server.port=8081
spring.config.import=optional:file:.env[.properties]
server.port=8081

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/eatbusan?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#open api
data.kakao.api.baseurl=https://dapi.kakao.com
data.kakao.api.service.key=${KAKAO_API_KEY}